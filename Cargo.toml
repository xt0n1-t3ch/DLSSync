[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "1.6.6"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xt0n1-t3ch/DLSSync"
authors = ["xt0n1-t3ch"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "brotli"] }
futures-util = "0.3"
bytes = "1"
tower = { version = "0.5", features = ["retry", "timeout", "util"] }
tokio-util = "0.7"
async-trait = "0.1"
sha2 = "0.10"
md-5 = "0.10"
ed25519-dalek = "2.1"
hex = "0.4"
blake3 = "1.5"
pelite = "0.10"
memchr = "2.7"
jwalk = "0.8"
walkdir = "2.5"
cms = { version = "0.2", default-features = false, features = ["std"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
der = "0.7"
const-oid = "0.9"
winreg = "0.55"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1.20"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
tempfile = "3.10"
uuid = { version = "1", features = ["v4", "serde"] }
wmi = "0.14"
sysinfo = "0.33"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
panic = "abort"
