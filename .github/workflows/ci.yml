name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (svelte-check)
        run: pnpm --filter dlssync-frontend check

      - name: Lint
        run: pnpm --filter dlssync-frontend lint

      # Build BEFORE vitest so the bundle-budget contract measures the real dist
      # instead of silently skipping on a clean runner.
      - name: Build (Vite)
        run: pnpm --filter dlssync-frontend build

      - name: Unit tests (vitest)
        run: pnpm --filter dlssync-frontend test

  rust:
    name: Rust (fmt + clippy + check)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Stub frontend dist for tauri::generate_context!
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path frontend/dist | Out-Null
          Set-Content -Path frontend/dist/index.html -Value '<!doctype html><html><head><meta charset="utf-8"><title>DLSSync</title></head><body></body></html>'

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check
        run: cargo check --workspace

      - name: Test
        run: cargo test --workspace --no-fail-fast

      - name: Generated bindings
        run: cargo xtask check-bindings

      - name: Generated product contract
        run: cargo xtask check-product

      - name: Architecture contract
        run: cargo xtask check-architecture

      - name: Competitive claim registry
        run: cargo xtask check-competitive

      - name: Release contracts
        shell: pwsh
        run: |
          cargo xtask verify-release --channel standard
          cargo xtask verify-release --channel nexus
          cargo xtask verify-release --channel portable

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87 # v2
        with:
          command: check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2

  e2e:
    name: E2E (Playwright over WebView2)
    runs-on: windows-latest
    needs: [frontend, rust, dependencies, secrets]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # global-setup builds the debug binary (pnpm tauri build --debug --no-bundle),
      # seeds hermetic app data, and launches WebView2 with the CDP port.
      # Playwright drives every app tab over CDP with zero expected skips.
      - name: E2E (Playwright)
        run: pnpm test:e2e
        timeout-minutes: 45

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: tests/e2e/.report
          retention-days: 1
