name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_NAME }
          $version = $tag -replace '^v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # A mistyped workflow_dispatch tag must never publish a latest.json whose
      # version disagrees with the binary inside — the updater would loop forever.
      - name: Guard tag against tauri.conf.json version
        shell: pwsh
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($conf -ne $env:TAG_VERSION) {
            throw "Tag version '$($env:TAG_VERSION)' != tauri.conf.json version '$conf' — refusing to release a mismatched pair"
          }
          Write-Host "Tag and tauri.conf.json agree on $conf"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize signing key
        id: keymat
        shell: pwsh
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'dlssync.key'
          [System.IO.File]::WriteAllText($keyPath, $env:PRIVATE_KEY, (New-Object System.Text.UTF8Encoding $false))
          "path=$keyPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build (Tauri)
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ steps.keymat.outputs.path }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Sign installer (explicit safety net)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ steps.keymat.outputs.path }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $installer = Get-ChildItem -Path target/release/bundle/nsis -Filter "*-setup.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "No installer .exe found to sign" }
          if (Test-Path "$($installer.FullName).sig") { Write-Host "Signature already produced by tauri build"; exit 0 }
          pnpm tauri signer sign $installer.FullName
          if (-not (Test-Path "$($installer.FullName).sig")) { throw "Signer ran but no .sig file produced" }
          Write-Host "Signature created: $($installer.Name).sig"

      - name: Inventory bundle output
        shell: pwsh
        run: |
          Write-Host "::group::target/release/bundle/nsis"
          Get-ChildItem -Path target/release/bundle/nsis -ErrorAction SilentlyContinue | Format-Table Name,Length -AutoSize
          Write-Host "::endgroup::"
          Write-Host "::group::target/release/bundle/msi"
          Get-ChildItem -Path target/release/bundle/msi -ErrorAction SilentlyContinue | Format-Table Name,Length -AutoSize
          Write-Host "::endgroup::"
          Write-Host "::group::target/release (top level)"
          Get-ChildItem -Path target/release -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.sig' } | Format-Table Name,Length -AutoSize
          Write-Host "::endgroup::"

      - name: Smoke-install MSI (silent install + uninstall)
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path target/release/bundle/msi -Filter "*.msi" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { throw "No .msi produced by tauri build" }
          $log = Join-Path $env:RUNNER_TEMP "msi-install.log"
          Write-Host "Installing $($msi.Name) silently…"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /quiet /norestart /l*v `"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40 -ErrorAction SilentlyContinue; throw "MSI install failed (exit $($p.ExitCode))" }
          Write-Host "Install OK. Uninstalling…"
          $u = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /quiet /norestart" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "MSI uninstall failed (exit $($u.ExitCode))" }
          Write-Host "MSI smoke-install + uninstall succeeded."

      - name: Build portable archive
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $portableDir = Join-Path $env:RUNNER_TEMP "DLSSync-portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item -Path target/release/dlssync.exe -Destination (Join-Path $portableDir "DLSSync.exe")
          $marker = @"
          DLSSync Portable Build
          ----------------------
          Version: $env:VERSION
          Mode:    portable

          This build does not install itself and does not auto-update in place.
          When a new version is released, DLSSync opens the GitHub release page
          and you replace DLSSync.exe manually.

          Settings, catalog, backups, and journal are stored under .\data.

          For unattended updates and tray integration, use the installer instead:
            https://github.com/xt0n1-t3ch/DLSSync/releases/latest
          "@
          Set-Content -Path (Join-Path $portableDir "portable.txt") -Value $marker -Encoding UTF8
          Set-Content -Path (Join-Path $portableDir "portable.flag") -Value "DLSSync portable data boundary" -Encoding ASCII
          $zipPath = "target/release/bundle/nsis/DLSSync_${env:VERSION}_x64-portable.zip"
          New-Item -ItemType Directory -Force -Path (Split-Path $zipPath -Parent) | Out-Null
          Compress-Archive -Path "$portableDir/*" -DestinationPath $zipPath -Force
          Write-Host "Built $zipPath"
          (Get-Item $zipPath).Length

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dlssync-windows-unsigned
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/nsis/*-portable.zip
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

  sign-windows:
    name: Sign Windows artifacts (SignPath)
    needs: build-windows
    runs-on: ubuntu-latest
    if: vars.SIGNPATH_ENABLED == 'true'
    outputs:
      signed: "true"
    steps:
      - name: Download unsigned artifact
        id: download
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dlssync-windows-unsigned
          path: unsigned

      - name: Submit to SignPath
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: dlssync
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.download.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dlssync-windows-signed
          path: signed/

  publish:
    name: Publish GitHub Release
    needs: [build-windows, sign-windows]
    # sign-windows 'skipped' (SignPath disabled) still publishes the unsigned
    # build; a sign-windows FAILURE must block the release instead of silently
    # shipping unsigned artifacts to the public.
    if: always() && needs.build-windows.result == 'success' && needs.sign-windows.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Determine artifact source
        id: source
        run: |
          if [ "${{ needs.sign-windows.result }}" = "success" ]; then
            echo "name=dlssync-windows-signed" >> $GITHUB_OUTPUT
          else
            echo "name=dlssync-windows-unsigned" >> $GITHUB_OUTPUT
          fi

      - name: Download release artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ steps.source.outputs.name }}
          path: release

      - name: Locate bundle files
        id: locate
        run: |
          exe=$(find release -name "*-setup.exe" -type f | head -n1)
          sig=$(find release -name "*-setup.exe.sig" -type f | head -n1)
          portable=$(find release -name "*-portable.zip" -type f | head -n1)
          msi=$(find release -name "*.msi" -type f | head -n1)
          echo "exe=$exe" >> $GITHUB_OUTPUT
          echo "sig=$sig" >> $GITHUB_OUTPUT
          echo "portable=$portable" >> $GITHUB_OUTPUT
          echo "msi=$msi" >> $GITHUB_OUTPUT
          echo "exe_name=$(basename "$exe")" >> $GITHUB_OUTPUT

      # SignPath re-signs the exe (Authenticode), changing its bytes — the
      # minisign .sig from build-windows no longer matches, so the Tauri
      # auto-updater would reject every download. Re-sign the FINAL bytes here.
      - name: Setup pnpm (re-sign updater signature)
        if: needs.sign-windows.result == 'success'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node.js (re-sign updater signature)
        if: needs.sign-windows.result == 'success'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Re-sign updater signature over the Authenticode-signed exe
        if: needs.sign-windows.result == 'success'
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          EXE_PATH: ${{ steps.locate.outputs.exe }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          keyfile="$RUNNER_TEMP/dlssync.key"
          printf '%s' "$PRIVATE_KEY" > "$keyfile"
          export TAURI_SIGNING_PRIVATE_KEY_PATH="$keyfile"
          pnpm tauri signer sign "$EXE_PATH"
          test -s "${EXE_PATH}.sig" || { echo "re-sign produced no .sig"; exit 1; }
          rm -f "$keyfile"

      - name: Install git-cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --version

      - name: Compose release notes
        id: notes
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}
          TAG: v${{ needs.build-windows.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/extract-changelog-section.py "$VERSION" CHANGELOG.md > release-body.md || : > release-body.md
          if [ ! -s release-body.md ] || [ "$(wc -c < release-body.md)" -lt 80 ]; then
            echo "CHANGELOG.md section for $VERSION missing or too short; falling back to git-cliff."
            git-cliff --config cliff.toml --tag "$TAG" --strip header --latest -o release-body.md
          fi
          if [ ! -s release-body.md ]; then
            echo "git-cliff produced no output; writing minimal placeholder."
            printf "Release **%s**.\n\nSee the [full changelog](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n" "$TAG" "${{ github.repository }}" > release-body.md
          fi
          echo "::group::release-body.md"
          cat release-body.md
          echo "::endgroup::"
          {
            echo 'body<<RELEASE_BODY_EOF'
            cat release-body.md
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate latest.json
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}
          TAG: v${{ needs.build-windows.outputs.version }}
          EXE_NAME: ${{ steps.locate.outputs.exe_name }}
          SIG_FILE: ${{ steps.locate.outputs.sig }}
        run: |
          set -euo pipefail
          signature=""
          if [ -n "$SIG_FILE" ] && [ -f "$SIG_FILE" ]; then
            signature=$(cat "$SIG_FILE")
          fi
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          url="https://github.com/xt0n1-t3ch/DLSSync/releases/download/$TAG/$EXE_NAME"
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes release-body.md \
            --arg pub_date "$pub_date" \
            --arg signature "$signature" \
            --arg url "$url" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: { "windows-x86_64": { signature: $signature, url: $url } }
            }' > release/latest.json
          echo "::group::latest.json"
          cat release/latest.json
          echo "::endgroup::"

      - name: Delete existing release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.build-windows.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release delete "$TAG" --repo ${{ github.repository }} --yes
          else
            echo "No existing release for $TAG — nothing to delete"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.build-windows.outputs.version }}
          name: DLSSync v${{ needs.build-windows.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: ${{ steps.notes.outputs.body }}
          files: |
            release/**/*-setup.exe
            release/**/*-setup.exe.sig
            release/**/*-portable.zip
            release/**/*.msi
            release/latest.json
