<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="DLSSync">
  <title>DLSSync</title>
  <desc>Open-source DLSS updater for Windows.</desc>

  <defs>
    <linearGradient id="bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0a0d13"/>
      <stop offset="100%" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="wordBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9ca5b4"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c2230" stroke-width="0.5"/>
    </pattern>
    <pattern id="dotsRight" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#22d3ee" fill-opacity="0.10"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="wordmarkMask">
      <text x="0" y="0" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="132" font-weight="800" letter-spacing="-5" fill="white">DLSSync</text>
    </mask>
    <style>
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes breath { 0%, 100% { opacity: 0.75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes shimmer-sweep { 0% { transform: translateX(0); } 100% { transform: translateX(960px); } }
      @keyframes ray-drift { 0% { transform: translateX(-200px); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.6; } 100% { transform: translateX(1480px); opacity: 0; } }
      @keyframes pulseDot { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      .mark { transform-box: fill-box; transform-origin: center; animation: spin 22s linear infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: breath 6s ease-in-out infinite; }
      .shimmer { animation: shimmer-sweep 5.5s ease-in-out infinite; }
      .ray { animation: ray-drift 11s linear infinite; }
      .dot1 { animation: pulseDot 3s ease-in-out infinite; }
      .dot2 { animation: pulseDot 3s ease-in-out 1s infinite; }
      .dot3 { animation: pulseDot 3s ease-in-out 2s infinite; }
      @media (prefers-reduced-motion: reduce) {
        .mark, .halo, .shimmer, .ray, .dot1, .dot2, .dot3 { animation: none; }
      }
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.55"/>
  <ellipse cx="640" cy="180" rx="640" ry="280" fill="url(#vignette)"/>
  <rect width="1280" height="360" fill="url(#dotsRight)" opacity="0.4"/>

  <rect class="ray" x="0" y="0" width="300" height="360" fill="url(#ray)" opacity="0.35"/>

  <line x1="0" y1="0" x2="1280" y2="0" stroke="url(#edge)" stroke-width="1"/>
  <line x1="0" y1="359" x2="1280" y2="359" stroke="url(#edge)" stroke-width="1" opacity="0.5"/>

  <g transform="translate(280 180)">
    <circle class="halo" cx="0" cy="0" r="120" fill="url(#halo)"/>
    <circle cx="0" cy="0" r="86" fill="#0a0d13" stroke="#1c2230" stroke-width="1"/>
    <g class="mark" filter="url(#glow)">
      <g transform="scale(5) translate(-12 -12)" fill="none" stroke="url(#ring)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7"/>
        <polyline points="3 4 3 9 8 9"/>
      </g>
    </g>
  </g>

  <g transform="translate(420 175)">
    <text x="0" y="0" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="132" font-weight="800" letter-spacing="-5" fill="url(#wordBase)">DLSSync</text>
    <g mask="url(#wordmarkMask)">
      <rect class="shimmer" x="-400" y="-120" width="380" height="150" fill="url(#shimmer)"/>
    </g>
  </g>

  <g transform="translate(420 245)" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#9ca5b4" letter-spacing="-0.2">
    <text x="0" y="0">Keep DLSS, FSR and XeSS in sync with vendor releases.</text>
  </g>

  <g transform="translate(420 295)" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="2">
    <text x="0" y="0" fill="#22d3ee">v1.0.0</text>
    <text x="60" y="0" fill="#2a3142">/</text>
    <text x="76" y="0" fill="#7a8597">APACHE-2.0</text>
    <text x="186" y="0" fill="#2a3142">/</text>
    <text x="202" y="0" fill="#7a8597">RUST</text>
    <text x="246" y="0" fill="#2a3142">/</text>
    <text x="262" y="0" fill="#7a8597">TAURI 2</text>
    <text x="334" y="0" fill="#2a3142">/</text>
    <text x="350" y="0" fill="#7a8597">SVELTE 5</text>
    <text x="438" y="0" fill="#2a3142">/</text>
    <text x="454" y="0" fill="#7a8597">WINDOWS</text>
  </g>

  <g transform="translate(1180 65)">
    <circle class="dot1" cx="0" cy="0" r="3" fill="#22d3ee"/>
    <circle class="dot2" cx="-14" cy="0" r="3" fill="#22d3ee"/>
    <circle class="dot3" cx="-28" cy="0" r="3" fill="#22d3ee"/>
  </g>
</svg>
